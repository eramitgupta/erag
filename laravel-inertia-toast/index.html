<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laravel Inertia Toast Docs</title>
  <meta
    name="description"
    content="Documentation landing page for Laravel Inertia Toast. Open the VitePress docs for installation, demos, Laravel usage, Vue, React, and API reference."
  >
  <style>
    :root {
      color-scheme: light;
      --bg: #111827;
      --panel: #0f172a;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #f24e1e;
      --border: rgba(148, 163, 184, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(180deg, #020617 0%, #111827 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(720px, 100%);
      padding: 40px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.94);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 2.8rem);
      line-height: 1.1;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    a {
      text-decoration: none;
    }

    .primary,
    .secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 8px;
      font-weight: 600;
    }

    .primary {
      background: var(--accent);
      color: #fff;
    }

    .secondary {
      border: 1px solid var(--border);
      color: var(--text);
    }
  </style>
</head>
<body>
  <main>
    <h1>Laravel Inertia Toast Docs</h1>
    <p>
      Toast notifications and confirmation dialogs for Laravel with Inertia.js, Vue 3, and React.
      Open the VitePress docs for setup, demos, framework usage, styling, and API reference.
    </p>
    <div class="actions">
      <a class="primary" href="/laravel-inertia-toast/index.html">Open Docs</a>
      <a class="secondary" href="https://github.com/eramitgupta/laravel-inertia-toast">GitHub</a>
    </div>
  </main>
</body>
</html>
