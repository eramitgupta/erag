<svg width="100%" viewBox="0 0 424 310" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <style>
    .server-line-animated {
      stroke-dasharray: 14 18;
      animation: server-line-flow 3.8s linear infinite;
    }

    .server-dot {
      animation: server-dot-pulse 1.8s ease-in-out infinite;
      fill: #264df7;
    }

    .server-dot:nth-of-type(2) {
      animation-delay: 0.2s;
    }

    .server-dot:nth-of-type(3) {
      animation-delay: 0.5s;
    }

    .bubble-float-a {
      animation: float-bubble-a 4.2s ease-in-out infinite;
      transform-origin: 78px 62px;
    }

    .bubble-float-q {
      animation: float-bubble-q 4.2s ease-in-out infinite;
      animation-delay: 0.9s;
      transform-origin: 346px 62px;
    }

    .sync-stream-left {
      stroke-dasharray: 4 5;
      animation: stream-flow-left 2s linear infinite;
    }

    .sync-stream-right {
      stroke-dasharray: 4 5;
      animation: stream-flow-right 2s linear infinite;
    }

    .sync-pulse-dot {
      animation: sync-pulse 2s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .sync-pulse-dot-2 {
      animation: sync-pulse 2s ease-in-out infinite 0.6s;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes server-line-flow {
      to {
        stroke-dashoffset: -32;
      }
    }

    @keyframes server-dot-pulse {
      0%,
      100% {
        opacity: 0.38;
        transform: scale(0.92);
        transform-origin: center;
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes float-bubble-a {
      0%, 100% {
        transform: scale(1.14) translateY(0px);
      }
      50% {
        transform: scale(1.14) translateY(-6px);
      }
    }

    @keyframes float-bubble-q {
      0%, 100% {
        transform: scale(1.14) translateY(0px);
      }
      50% {
        transform: scale(1.14) translateY(6px);
      }
    }

    @keyframes stream-flow-left {
      to {
        stroke-dashoffset: -18;
      }
    }

    @keyframes stream-flow-right {
      to {
        stroke-dashoffset: -18;
      }
    }

    @keyframes sync-pulse {
      0%, 100% {
        opacity: 0.35;
        transform: scale(0.85);
      }
      50% {
        opacity: 1;
        transform: scale(1.25);
      }
    }
  </style>
