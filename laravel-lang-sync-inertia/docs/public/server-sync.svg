  <style>
    .server-line-animated {
      stroke-dasharray: 14 18;
      animation: server-line-flow 3.8s linear infinite;
    }

    .server-dot {
      animation: server-dot-pulse 1.8s ease-in-out infinite;
      fill: #2563eb;
    }

    .server-dot:nth-of-type(2) {
      animation-delay: 0.2s;
    }

    .server-dot:nth-of-type(3) {
      animation-delay: 0.5s;
    }

    @keyframes server-line-flow {
      to {
        stroke-dashoffset: -32;
      }
    }

    @keyframes server-dot-pulse {
      0%,
      100% {
        opacity: 0.38;
        transform: scale(0.92);
        transform-origin: center;
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
